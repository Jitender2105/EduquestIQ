name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse HOSTINGER secret
        id: hostinger
        shell: bash
        env:
          HOSTINGER_SECRET: ${{ secrets.HOSTINGER }}
        run: |
          # Supported HOSTINGER formats:
          # host|username|password|port
          # host|username|password   (port defaults to 21)
          SECRET="$(echo "$HOSTINGER_SECRET" | tr -d '\r' | xargs)"
          IFS='|' read -r FTP_HOST FTP_USER FTP_PASS FTP_PORT <<< "$SECRET"

          if [[ -z "$FTP_HOST" || -z "$FTP_USER" || -z "$FTP_PASS" ]]; then
            echo "HOSTINGER secret is missing or invalid."
            echo "Expected: host|username|password|port (or without port)."
            exit 1
          fi

          FTP_HOST="${FTP_HOST#ftp://}"
          FTP_HOST="${FTP_HOST#ftps://}"
          FTP_PORT="${FTP_PORT:-21}"

          echo "server=$FTP_HOST" >> "$GITHUB_OUTPUT"
          echo "username=$FTP_USER" >> "$GITHUB_OUTPUT"
          echo "password=$FTP_PASS" >> "$GITHUB_OUTPUT"
          echo "port=$FTP_PORT" >> "$GITHUB_OUTPUT"

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via lftp mirror
        shell: bash
        env:
          FTP_HOST: ${{ steps.hostinger.outputs.server }}
          FTP_USER: ${{ steps.hostinger.outputs.username }}
          FTP_PASS: ${{ steps.hostinger.outputs.password }}
          FTP_PORT: ${{ steps.hostinger.outputs.port }}
        run: |
          set -euo pipefail

          lftp -u "$FTP_USER","$FTP_PASS" -p "$FTP_PORT" "$FTP_HOST" <<'EOF'
          set ftp:ssl-allow no
          set ftp:passive-mode true
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set mirror:use-pget-n 5
          set xfer:clobber on
          mirror --reverse --delete --verbose \
            --exclude-glob .git* \
            --exclude-glob .github/** \
            --exclude-glob .DS_Store \
            --exclude-glob config.local.php \
            --exclude-glob uploads/** \
            ./ /domains/eduquestiq.com/public_html/
          bye
          EOF
